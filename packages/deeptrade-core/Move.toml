[package]
name = "deeptrade_core"
version = "2.0.0"
edition = "2024.alpha"

[dependencies]
deepbook = { git = "https://github.com/MystenLabs/deepbookv3.git", subdir = "packages/deepbook", rev = "v4.0.0" }
token = { git = "https://github.com/MystenLabs/deepbookv3.git", subdir = "packages/token", rev = "main" }
multisig = { git = "https://github.com/DeeptradeProtocol/multisig-move.git", subdir = "move", rev = "v1.0.1" }

# Pyth dependency
pyth = { git = "https://github.com/pyth-network/pyth-crosschain.git", subdir = "target_chains/sui/contracts", rev = "sui-contract-mainnet" }
# Pyth's upgraded Core: a separate on-chain package, not an upgrade of the above. Both are
# linked at once so the legacy entrypoints keep their frozen signatures.
pyth_upgraded = { git = "https://github.com/pyth-network/pyth-crosschain.git", subdir = "target_chains/sui/contracts", rev = "sui-pro-compatible-contract-mainnet", rename-from = "pyth" }

# For `sui move test`, comment the production pins above and uncomment these.
# Never leave both copies uncommented.
